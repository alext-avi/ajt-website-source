name: Verify and deploy website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Hold the production lock through verification, deployment, and live checks.
# PRs and the public source repo get unique groups and remain independent.
concurrency:
  group: ${{ github.repository == 'alext-avi/ajt-website' && github.ref == 'refs/heads/main' && 'production' || format('verification-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: false
env:
  ASTRO_TELEMETRY_DISABLED: '1'
  SITE_URL: ${{ vars.SITE_URL }}
  PUBLIC_GA4_MEASUREMENT_ID: ${{ vars.PUBLIC_GA4_MEASUREMENT_ID }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      # Match @playwright/test; includes browsers and their system libraries.
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify types, browser flows, and content contracts
        run: npm run test:ci
      - name: Save Playwright report and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
  deploy:
    needs: verify
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
      credentials-configured: ${{ steps.credentials.outputs.configured }}
    if: >-
      github.repository == 'alext-avi/ajt-website' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check deployment credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Deployment skipped: CLOUDFLARE_API_TOKEN is not configured. Verification still runs; the live site is unchanged.'
            echo '### Deployment skipped' >> "$GITHUB_STEP_SUMMARY"
            echo 'Configure the CLOUDFLARE_API_TOKEN repository secret to enable automatic deployment. See docs/deployment.md. The live site was not changed by this run.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.credentials.outputs.configured == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.credentials.outputs.configured == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: steps.credentials.outputs.configured == 'true'
      - name: Build verified source for production
        if: steps.credentials.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run db:pull -- --remote && npm run verify && node scripts/check-deploy.mjs
      - name: Check this commit is still the latest main
        id: current
        if: steps.credentials.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer commit is on main; skipping this outdated deployment.'
          fi
      - name: Deploy to Cloudflare
        id: deploy
        if: steps.credentials.outputs.configured == 'true' && steps.current.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --no-install wrangler deploy
          echo 'deployed=true' >> "$GITHUB_OUTPUT"
  production-checks:
    needs: [verify, deploy]
    if: >-
      github.repository == 'alext-avi/ajt-website' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.deploy.result == 'success' &&
      (needs.deploy.outputs.deployed == 'true' || needs.deploy.outputs.credentials-configured == 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    env:
      PLAYWRIGHT_PRODUCTION_URL: ${{ vars.SITE_URL }}
      PLAYWRIGHT_GA4_MEASUREMENT_ID: ${{ vars.PUBLIC_GA4_MEASUREMENT_ID }}
      PLAYWRIGHT_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
      PRODUCTION_DEPLOYMENT: ${{ needs.deploy.outputs.deployed == 'true' && 'deployed-this-run' || 'existing-production-deployment' }}
      GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
      GA4_STREAM_ID: ${{ vars.GA4_STREAM_ID }}
      GA4_GOOGLE_CLOUD_PROJECT: ${{ vars.GA4_GOOGLE_CLOUD_PROJECT }}
      GA4_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GA4_WORKLOAD_IDENTITY_PROVIDER }}
      GA4_SERVICE_ACCOUNT: ${{ vars.GA4_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Identify the live deployment under test
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### Real production browser tests

          Target: $PLAYWRIGHT_PRODUCTION_URL

          Deployment: $PRODUCTION_DEPLOYMENT

          Workflow marker: $PLAYWRIGHT_RUN_ID. Browser markers append -d (desktop Chromium) or -m (mobile Safari), with source playwright-ci, medium testing, campaign production-checks.

          The browser uses the deployed Google tag after consent. Reports attach Cloudflare response IDs and Google collection responses. Testing an existing deployment does not attest that this workflow's source revision was deployed.
          EOF
      - name: Check GA4 API read-back configuration
        run: |
          for setting in GA4_PROPERTY_ID GA4_STREAM_ID GA4_GOOGLE_CLOUD_PROJECT GA4_WORKLOAD_IDENTITY_PROVIDER GA4_SERVICE_ACCOUNT; do
            if [ -z "$(printenv "$setting")" ]; then
              echo "::error::Missing $setting. Configure read-only GA4 API access before running the round-trip check."
              exit 1
            fi
          done
      - name: Test the real website and Google Analytics collection
        run: npm run test:live
      - name: Authenticate for read-only GA4 reporting
        id: ga4-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GA4_GOOGLE_CLOUD_PROJECT }}
          workload_identity_provider: ${{ vars.GA4_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GA4_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/analytics.readonly
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Read this run's GA4 ingestion status
        env:
          GA4_ACCESS_TOKEN: ${{ steps.ga4-auth.outputs.access_token }}
        run: npm run ga4:verify
      - name: Save live browser and network evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-playwright-results
          path: |
            playwright-report-production/
            test-results-production/
          if-no-files-found: ignore
          retention-days: 7
