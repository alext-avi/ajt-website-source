<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410"><rect width="960" height="410" fill="#101e33"/><g font-family="Arial,sans-serif"><text x="44" y="47" font-size="13" fill="#dfbd79" letter-spacing="2">ILLUSTRATIVE PATTERN / AUTHORITY LIVES IN APPLICATION CODE</text><path d="M216 190H268M440 190H492M664 190H716" fill="none" stroke="#bd9655" stroke-width="2"/><g fill="#162740" stroke="#4b6081"><rect x="44" y="119" width="172" height="142" rx="5"/><rect x="268" y="119" width="172" height="142" rx="5"/><rect x="492" y="119" width="172" height="142" rx="5"/><rect x="716" y="119" width="200" height="142" rx="5"/></g><g fill="#dfbd79" font-size="21"><text x="66" y="169">Request</text><text x="289" y="169">Permission</text><text x="289" y="197">check</text><text x="513" y="169">Proposal</text><text x="738" y="169">Human review</text></g><g fill="#b7c4d6" font-size="12"><text x="66" y="225">A bounded intent</text><text x="289" y="225">Trusted application code</text><text x="513" y="225">Evidence + exact change</text><text x="738" y="225">Explicit decision</text></g><path d="M816 261v56H144" fill="none" stroke="#bd9655" stroke-width="2" stroke-dasharray="5 5"/><rect x="44" y="294" width="360" height="64" fill="#dfbd79" rx="4"/><text x="65" y="320" fill="#101b2e" font-size="16">Separate execution boundary</text><text x="65" y="341" fill="#263a57" font-size="11">Recheck identity, scope, and the approved proposal</text><text x="480" y="366" fill="#b7c4d6" font-size="12">A proposal is not permission to execute.</text></g></svg>
